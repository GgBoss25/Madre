<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Feliz Cumpleaños Mita 🌻</title>

  <!-- Fuentes elegantes y legibles -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Lora:wght@400;500&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(180deg, #fff5cc, #ffd966);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 🌻 Fondo animado */
    .fondo {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
    }

    .girasol {
      position: absolute;
      font-size: 40px;
      opacity: 0.25;
      animation: flotar linear infinite;
    }

    @keyframes flotar {
      from { transform: translateY(110vh) rotate(0deg); }
      to { transform: translateY(-10vh) rotate(360deg); }
    }

    /* 🌸 Tarjeta */
    .card {
      background: rgba(255, 255, 255, 0.97);
      border-radius: 34px;
      padding: 34px;
      width: 92%;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0,0,0,0.25);
      animation: aparecer 1.2s ease;
    }

    @keyframes aparecer {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }

    h1 {
      font-family: 'Playfair Display', serif;
      color: #d4a000;
      font-size: 30px;
      margin-bottom: 5px;
    }

    h2 {
      font-family: 'Playfair Display', serif;
      color: #555;
      font-size: 24px;
      margin-top: 0;
    }

    /* 📜 Caja del mensaje */
    .mensaje-box {
      position: relative;
      background: #fffaf0;
      border-radius: 22px;
      padding: 24px;
      margin-top: 18px;
      border: 2px dashed #f5c400;
      overflow: hidden;
      box-shadow: inset 0 0 14px rgba(0,0,0,0.05);
    }

    /* 🎉 Emojis animados dentro del texto */
    .emoji-flotante {
      position: absolute;
      font-size: 26px;
      opacity: 0.18;
      animation: flotarEmoji linear infinite;
      pointer-events: none;
    }

    @keyframes flotarEmoji {
      from { transform: translateY(120%); }
      to { transform: translateY(-120%); }
    }

    #mensaje {
      position: relative;
      font-family: 'Lora', serif;
      font-size: 17px;
      line-height: 1.85;
      color: #333;
      z-index: 2;
      min-height: 260px;
    }

    .firma {
      margin-top: 18px;
      font-family: 'Lora', serif;
      font-size: 16px;
      color: #555;
    }

    button {
      margin-top: 22px;
      padding: 13px 32px;
      border: none;
      border-radius: 35px;
      background: linear-gradient(135deg, #f5b700, #e0a800);
      color: white;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0,0,0,0.25);
      font-family: 'Playfair Display', serif;
    }
  </style>
</head>
<body>

  <!-- 🌻 Fondo -->
  <div class="fondo" id="fondo"></div>

  <!-- 🌸 Tarjeta -->
  <div class="card">
    <h1>🌻 Feliz Cumpleaños 🌻</h1>
    <h2>Mita 💛</h2>

    <div class="mensaje-box" id="mensajeBox">
      <div id="mensaje">
        Mamita hermosa 💛<br><br>
        Hoy celebro tu vida y todo lo que eres para mí.
        Gracias por tu amor infinito, por cuidarme siempre
        y por ser la mejor madre que pude tener.
      </div>
    </div>

    <div class="firma">— Con todo mi amor 💛</div>

    <button onclick="mostrarMensaje()">🎉 Sorpresa</button>
  </div>

  <script>
    /* 🌻 Girasoles del fondo */
    const fondo = document.getElementById("fondo");
    for (let i = 0; i < 26; i++) {
      const flor = document.createElement("div");
      flor.className = "girasol";
      flor.innerHTML = "🌻";
      flor.style.left = Math.random() * 100 + "vw";
      flor.style.animationDuration = (10 + Math.random() * 15) + "s";
      flor.style.fontSize = (26 + Math.random() * 36) + "px";
      fondo.appendChild(flor);
    }

    /* 🎂 Emojis de cumpleaños dentro del mensaje */
    const box = document.getElementById("mensajeBox");
    const emojis = ["🎂", "🎉", "🎈"];

    for (let i = 0; i < 7; i++) {
      const emoji = document.createElement("div");
      emoji.className = "emoji-flotante";
      emoji.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
      emoji.style.left = Math.random() * 100 + "%";
      emoji.style.animationDuration = (8 + Math.random() * 10) + "s";
      emoji.style.fontSize = (22 + Math.random() * 16) + "px";
      box.appendChild(emoji);
    }

    /* 💛 Mensajes largos */
    const mensajes = [
      "Mita hermosa 💛<br><br>" +
      "Hoy quiero agradecerte por cada sacrificio que hiciste por mí, incluso por aquellos que nunca mencionaste. Tu amor silencioso me formó, me cuidó y me enseñó a ser una buena persona.",

      "Madrecita 🌻<br><br>" +
      "Si hoy camino con valores, respeto y buenos principios, es porque tú me enseñaste con tu ejemplo. Todo lo bueno que hay en mí nació de tu forma tan linda de criarme.",

      "Mamita linda 💛<br><br>" +
      "Gracias por creer en mí incluso cuando yo dudé. Tu apoyo fue mi fuerza, tu voz fue mi guía y tu amor fue el impulso que necesitaba para seguir adelante.",

      "Mita querida 🌻<br><br>" +
      "Cada logro que alcance llevará siempre tu nombre, porque sin ti nada de esto sería posible. Eres mi orgullo más grande y mi ejemplo a seguir.",

      "Madre hermosa 💛<br><br>" +
      "Gracias por nunca rendirte conmigo, por corregirme con amor y por cuidarme incluso cuando yo no sabía cuidarme solo. Tu entrega ha sido el regalo más grande de mi vida.",

      "Mamita 🌻<br><br>" +
      "Gracias a ti aprendí a amar, a respetar y a soñar. Gracias a ti hoy soy un buen chico y deseo ser siempre un ejemplo para los demás.",

      "Mita de mi corazón 🎂<br><br>" +
      "Hoy celebro tu vida y agradezco a Dios por regalarme una madre como tú. Te amo con todo mi corazón y siempre lo haré."
    ];

    let i = 0;
    function mostrarMensaje() {
      document.getElementById("mensaje").innerHTML = mensajes[i];
      i = (i + 1) % mensajes.length;
    }
  </script>

</body>
</html>
